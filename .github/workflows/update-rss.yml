name: Actualizar Radar RSS
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-rss
  cancel-in-progress: true
jobs:
  update-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-rss.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-rss.txt
      - name: Actualizar noticias
        run: |
          python scripts/fetch_rss.py
          python scripts/fetch_youtube.py
      - name: Publicar cambios
        run: |
          if git diff --quiet -- src/scripts/data/rss-news.json src/scripts/data/youtube-videos.json; then
            echo "El centro editorial ya está actualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scripts/data/rss-news.json src/scripts/data/youtube-videos.json
          git commit -m "chore: actualiza Radar Tech y Shorts"
          git push
