<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contacto de KYNOVA para desarrollo web y marketing digital." />
    <title>Contacto | KYNOVA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://calendar.google.com/calendar/scheduling-button-script.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/styles/main.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header" data-header>
        <a class="brand" href="../">
          <img class="brand__logo" src="../assets/brand/logo-kynova-official.png" alt="KYNOVA, agencia de soluciones digitales" />
        </a>
        <button class="nav-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" data-nav-toggle>
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="site-nav" aria-label="Navegación principal" data-nav>
          <a href="../nosotros/">Nosotros</a>
          <a href="../proyectos/">Proyectos</a>
          <a href="../costos/">Costos</a>
          <a href="../contacto/">Contacto</a>
        </nav>
      </header>

      <main class="simple-page">
        <p class="eyebrow">Contacto</p>
        <h1>Cotiza tu proyecto por WhatsApp.</h1>
        <p>
          Cuéntanos en una frase breve qué necesitas y seguimos por WhatsApp.
        </p>
        <div class="simple-actions">
          <a
            class="button button--primary"
            href="https://wa.me/529987449856?text=Hola,%20me%20gustar%C3%ADa%20cotizar%20un%20proyecto"
            data-copy-value="+52 998 744 9856"
            target="_blank"
            rel="noreferrer"
          >
            Cotizar por WhatsApp
          </a>
          <div data-calendar-booking></div>
        </div>

        <section class="contact-socials" aria-labelledby="contact-socials-title">
          <div>
            <p class="eyebrow">Redes oficiales</p>
            <h2 id="contact-socials-title">Conoce más de KYNOVA</h2>
          </div>
          <div class="contact-socials__links">
            <a
              class="button button--ghost social-link social-link--instagram"
              href="https://www.instagram.com/kynova.asd/"
              target="_blank"
              rel="noopener noreferrer"
            >Instagram</a>
            <a
              class="button button--ghost social-link social-link--facebook"
              href="https://www.facebook.com/profile.php?id=61584581761315"
              target="_blank"
              rel="noopener noreferrer"
            >Facebook</a>
            <a
              class="button button--ghost contact-socials__github"
              href="https://github.com/KYNOVA-asd"
              target="_blank"
              rel="noopener noreferrer"
            >GitHub</a>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="../src/scripts/site.js"></script>
  </body>
</html>
