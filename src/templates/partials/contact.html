<section class="menu-contact" id="contacto" aria-labelledby="contact-title">
  <div class="menu-contact__copy">
    <p class="eyebrow">Contacto rápido</p>
    <h2 id="contact-title">Cuéntanos qué quieres construir</h2>
    <p>Escribe una idea breve y continuamos la conversación directamente por WhatsApp.</p>
    <div class="contact-links" data-contact-links></div>
    <div class="home-booking"><p>¿Prefieres hablarlo con calma?</p><div data-calendar-booking></div></div>
  </div>
  <form class="contact-card" data-contact-form>
    <label>Nombre<input name="name" type="text" placeholder="Tu nombre" required /></label>
    <label>¿Qué necesitas?<input name="message" type="text" maxlength="40" placeholder="Una tienda, sitio o sistema" required /><small class="field-hint">Máximo 40 caracteres.</small></label>
    <button class="button button--primary" type="submit">Cotizar por WhatsApp</button>
    <p class="form-note" data-form-note role="status"></p>
  </form>
</section>
